name: Build and Deploy to Nginx

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nginx-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hugo image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: boke-builder
          # boke 部署在 https://bealzhao.cn/blog/ 子路径（根路径 / 是其他站点）。
          # BASE_URL 必须带上 /blog/，Hugo 才会生成 /blog/css/... 这类带前缀的链接；
          # 若不带，浏览器会请求 /css/...，nginx 找不到文件 → 404。
          build-args: |
            BASE_URL=${{ vars.BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export static site (public/)
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          docker run --rm -v "$PWD/public:/out" boke-builder cp -r /src/public/. /out/
          test -f public/index.html \
            && echo "public/index.html 生成成功" \
            || { echo "::error::public/index.html 未生成，Hugo 构建可能失败"; exit 1; }

      - name: Deploy to server nginx via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          WEBROOT: ${{ vars.SERVER_WEBROOT }}
        run: |
          set -euo pipefail

          # ---- 配置校验 ----
          [ -n "$SSH_HOST" ] || { echo "::error::缺少 secret: SSH_HOST（服务器 IP 或域名）"; exit 1; }
          [ -n "$SSH_USER" ] || { echo "::error::缺少 secret: SSH_USER（SSH 用户名）"; exit 1; }
          [ -n "$SSH_KEY" ] || { echo "::error::缺少 secret: SSH_KEY（SSH 私钥完整内容）"; exit 1; }
          [ -n "$WEBROOT" ] || { echo "::error::缺少 variable: SERVER_WEBROOT（nginx Pod hostPath 卷的宿主机目录，如 /data/nginx-blog）"; exit 1; }

          # ---- SSH 准备 ----
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # ---- 同步静态文件到服务器 nginx hostPath 卷目录 ----
          # SERVER_WEBROOT = nginx Pod 挂载 /usr/share/nginx/html/blog 的宿主机目录（见 deploy/README.md）
          # --delete：删除服务器上已不存在的旧文件，该目录专属于 boke，可安全清理
          echo "同步 public/ → ${SSH_USER}@${SSH_HOST}:${WEBROOT}/"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            "$PWD/public/" "${SSH_USER}@${SSH_HOST}:${WEBROOT}/"

          # ---- 远程校验 ----
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "test -f ${WEBROOT}/index.html && echo '::notice::部署完成: ${WEBROOT}/index.html 存在' || { echo '::error::部署后 index.html 不存在'; exit 1; }"
