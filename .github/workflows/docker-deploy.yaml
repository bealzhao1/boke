name: Build and Deploy to K8s

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: k8s-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            BASE_URL=${{ vars.BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBECONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --client --output=yaml

      - name: Deploy to cluster
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail

          # 1) 注入真实镜像 tag（ghcr.io/<owner>/<repo>:<sha>）
          sed -i "s|image: .*|image: ${IMAGE}|" deploy/deployment.yaml

          # 2) 可选：从 GitHub Variables 注入域名
          if [ -n "${{ vars.BLOG_HOST }}" ]; then
            sed -i "s|host: .*|host: ${{ vars.BLOG_HOST }}|" deploy/ingress.yaml
          fi

          # 3) 命名空间
          kubectl apply -f deploy/namespace.yaml

          # 4) ghcr 拉取凭证（用长期有效的 PAT）
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GHCR_PAT }}" \
            --namespace=hugo \
            --dry-run=client -o yaml | kubectl apply -f -

          # 5) 部署应用
          kubectl apply -f deploy/deployment.yaml -f deploy/service.yaml -f deploy/ingress.yaml

      - name: Verify rollout
        run: |
          kubectl -n hugo rollout status deployment/boke --timeout=180s
          kubectl -n hugo get pods,svc,ingress
