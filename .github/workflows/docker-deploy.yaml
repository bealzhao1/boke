name: Build and Deploy to K8s

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: k8s-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            BASE_URL=${{ vars.BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          # 校验：secret 不能为空
          if [ ! -s "$HOME/.kube/config" ]; then
            echo "::error::KUBE_CONFIG secret 为空或未配置。请到 Settings → Secrets and variables → Actions → KUBE_CONFIG 粘贴 kubeconfig 完整内容。"
            exit 1
          fi

          # 校验：能解析出 cluster 且 server 不是本机默认地址
          SERVER="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null || true)"
          echo "目标 server: ${SERVER:-<未解析到>}"
          case "${SERVER}" in
            *localhost*|*127.0.0.1*|"")
              echo "::error::kubeconfig 的 server 仍是本机地址或未解析到。请把 /etc/rancher/k3s/k3s.yaml 里的 server 改成公网地址（如 https://<公网IP>:6443）后再粘贴，并确保 k3s 安装时加了 --tls-san。"
              exit 1
              ;;
          esac

          kubectl version --client --output=yaml

      - name: Deploy to cluster
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail

          # 1) 注入真实镜像 tag（ghcr.io/<owner>/<repo>:<sha>）
          sed -i "s|image: .*|image: ${IMAGE}|" deploy/deployment.yaml

          # 2) 可选：从 GitHub Variables 注入域名
          if [ -n "${{ vars.BLOG_HOST }}" ]; then
            sed -i "s|host: .*|host: ${{ vars.BLOG_HOST }}|" deploy/ingress.yaml
          fi

          # 3) 命名空间
          kubectl apply -f deploy/namespace.yaml

          # 4) ghcr 拉取凭证（用长期有效的 PAT）
          if [ -z "${{ secrets.GHCR_PAT }}" ]; then
            echo "::error::GHCR_PAT secret 为空。请到 Settings → Secrets and variables → Actions → GHCR_PAT 配置一个带 read:packages 权限的 Personal Access Token（长期有效）。"
            exit 1
          fi
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GHCR_PAT }}" \
            --namespace=hugo \
            --dry-run=client -o yaml | kubectl apply -f -

          # 5) Traefik 中间件（剥离 /blog 前缀，必须先于 ingress 创建）
          kubectl apply -f deploy/middleware.yaml

          # 6) 部署应用
          kubectl apply -f deploy/deployment.yaml -f deploy/service.yaml -f deploy/ingress.yaml

      - name: Verify rollout
        run: |
          set -euo pipefail
          if kubectl -n hugo rollout status deployment/boke --timeout=600s; then
            echo "::notice::✅ rollout 完成"
            kubectl -n hugo get pods,svc,ingress
          else
            echo "::error::rollout 超时，开始收集诊断信息..."
            echo ""
            echo "===== 1) Pods 状态 ====="
            kubectl -n hugo get pods -o wide || true
            echo ""
            echo "===== 2) Deployment 详情 ====="
            kubectl -n hugo describe deployment/boke || true
            echo ""
            echo "===== 3) Pod 事件（含镜像拉取错误原因） ====="
            kubectl -n hugo describe pods || true
            echo ""
            echo "===== 4) 最近 events ====="
            kubectl -n hugo get events --sort-by=.lastTimestamp || true
            echo ""
            echo "===== 5) 各 Pod 日志（最近 50 行） ====="
            for p in $(kubectl -n hugo get pods -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              echo "--- ${p} ---"
              kubectl -n hugo logs --tail=50 "${p}" --all-containers=true || true
              echo ""
            done
            exit 1
          fi
