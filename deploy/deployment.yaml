apiVersion: apps/v1
kind: Deployment
metadata:
  name: boke
  namespace: hugo
  labels:
    app: boke
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: boke
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: boke
    spec:
      # GHCR 镜像为私有时需要；若包已设为 public 可删除此段
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: boke
          image: ghcr.io/bealzhao1/boke:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
