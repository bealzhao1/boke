# 剥离 /blog 前缀：/blog/css/style.css -> /css/style.css
# 必须剥离，因为容器内静态文件就在站点根目录（/usr/share/nginx/html），
# 不剥离的话 Pod 会去找 /usr/share/nginx/html/blog/css/style.css，直接 404
#
# ⚠️ API 版本取决于 Traefik 版本，apply 报 "no matches for kind Middleware" 时换另一个：
#   Traefik v3 → traefik.io/v1alpha1
#   Traefik v2 → traefik.containo.us/v1alpha1
# 检查命令：kubectl get crd middlewares.traefik.io middlewares.traefik.containo.us
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-blog
  namespace: hugo
spec:
  stripPrefix:
    prefixes:
      - /blog
