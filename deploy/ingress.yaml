apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boke
  namespace: hugo
  labels:
    app.kubernetes.io/name: boke
  annotations:
    # Traefik 入口：web = HTTP(80)
    # 若要启用 HTTPS，改为 web,websecure 并配合下面的 tls 段
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # 剥离 /blog 前缀的中间件（定义在 deploy/middleware.yaml）
    # 引用格式固定为：<namespace>-<name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: hugo-strip-blog@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - bealzhao.cn
      secretName: demo-tls-secret
  rules:
    # 需要限定域名时解开下面这行注释。
    # ⚠️ 行首的 "-" 是列表项标记，必须保留；否则 rules 会变成对象而不是数组，apply 会失败。
    - # host: blog.bealzhao.com
      http:
        paths:
          - path: /blog
            pathType: Prefix
            backend:
              service:
                name: boke
                port:
                  number: 9090
