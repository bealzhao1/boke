baseURL = '/'
# 生产部署时由 CI 通过 --build-arg BASE_URL 传入服务器真实地址（见 docker-deploy.yaml 的 vars.BASE_URL）
locale = 'zh-cn'
title = 'bealzhao 博客'
theme = 'PaperMod'

hasCJKLanguage = true

[params]
  env = 'production'
  defaultTheme = 'light'
  DateFormat = '2006-01-02'
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.homeInfoParams]
    Title = '欢迎来到 bealzhao 博客'
    Content = '积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里，不积小流，无以成江海。'
